[workspace]
resolver = "2"
members = [
    "contracts/types",
    "contracts/risk-oracle",
    "contracts/event-registry",
    "contracts/reporter-staking",
    "contracts/market-factory",
    "contracts/series",
    "contracts/governor",
    "contracts/adapters/amm-soroswap",
    "contracts/adapters/fx-reference",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Anchorline-labs/anchorline"

[workspace.dependencies]
soroban-sdk = "29.0.0"
anchorline-types = { path = "contracts/types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
